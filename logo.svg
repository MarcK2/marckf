<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="MarcKFragrance">
  <title>MarcKFragrance</title>
  <defs>
    <linearGradient id="fond" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a2a22"/>
      <stop offset="1" stop-color="#1e1612"/>
    </linearGradient>
    <linearGradient id="goutte" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#f2c38b"/>
      <stop offset="0.55" stop-color="#d48a4e"/>
      <stop offset="1" stop-color="#9c5631"/>
    </linearGradient>
  </defs>
  <!-- fond rond : avatar de chaîne, favicon -->
  <circle cx="256" cy="256" r="256" fill="url(#fond)"/>
  <!-- trois volutes : notes de tête, de cœur et de fond qui s'élèvent -->
  <g fill="none" stroke="#f2c38b" stroke-linecap="round" stroke-width="14">
    <path d="M214 196 C 190 168, 238 150, 214 118" opacity="0.55"/>
    <path d="M256 186 C 230 152, 284 132, 256 92" opacity="0.85"/>
    <path d="M298 196 C 274 168, 322 150, 298 118" opacity="0.55"/>
  </g>
  <!-- la goutte -->
  <path d="M256 214 C 256 214, 178 304, 178 352 C 178 396, 213 430, 256 430 C 299 430, 334 396, 334 352 C 334 304, 256 214, 256 214 Z" fill="url(#goutte)"/>
  <!-- reflet -->
  <path d="M222 340 C 222 314, 238 292, 250 278" fill="none" stroke="#fff3e3" stroke-linecap="round" stroke-width="12" opacity="0.6"/>
</svg>
